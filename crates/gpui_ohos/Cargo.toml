[package]
name = "gpui_ohos"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_ohos.rs"

# Clean OHOS backend: XComponent + dlopen + hand-written Vulkan.
# No openharmony-ability, no ohos-arkui-input-binding, no wgpu, no build scripts.
[dependencies]
gpui.workspace = true
anyhow.workspace = true
collections.workspace = true
futures.workspace = true
raw-window-handle = "0.6"
uuid.workspace = true

# Text shaping/rasterization (fonts come from /system/fonts).
cosmic-text = "0.17"
etagere = "0.2"
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
smallvec.workspace = true

[build-dependencies]
naga = { version = "29", features = ["wgsl-in", "spv-out"] }
