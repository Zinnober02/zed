[package]
name = "livekit_api"
version = "0.1.0"
edition.workspace = true
description = "SDK for the LiveKit server API"
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/livekit_api.rs"
doctest = false

[features]
test-support = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
log.workspace = true
prost.workspace = true
prost-types.workspace = true
reqwest.workspace = true
serde.workspace = true

[build-dependencies]
prost-build.workspace = true
protox.workspace = true

[package.metadata.cargo-shear]
ignored = ["prost-types"]

# aws-lc-sys needs a CMake/NDK toolchain OHOS does not provide, and cargo
# unifies features across targets, so use the pure Rust crypto provider
# everywhere rather than gating it per target.
[target.'cfg(target_env = "ohos")'.dependencies]
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
